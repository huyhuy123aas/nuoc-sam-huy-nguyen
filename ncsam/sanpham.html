<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sản phẩm - Nước Sâm Huy Nguyễn</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5fff5;
}

nav{
    background:green;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

nav a:hover{
    color:gold;
}

h1{
    text-align:center;
    color:darkgreen;
    margin:30px 0;
}

.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.product{
    width:300px;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    cursor:pointer;
    transition:.3s;
}

.product:hover{
    transform:translateY(-10px);
}

.product img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.product-content{
    padding:20px;
    text-align:center;
}

.product h3{
    color:darkgreen;
}

.product-price{
    font-size:24px;
    color:red;
    font-weight:bold;
    margin-top:10px;
}

/* POPUP */

.popup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    z-index:9999;
}

.popup-content{
    background:white;
    width:90%;
    max-width:700px;
    margin:40px auto;
    padding:25px;
    border-radius:20px;
    position:relative;
    animation:hienlen .3s ease;
}

@keyframes hienlen{

    from{
        opacity:0;
        transform:scale(0.8);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

.close{
    position:absolute;
    top:10px;
    right:20px;
    font-size:35px;
    cursor:pointer;
    color:red;
}

.close:hover{
    color:black;
}

.popup-content img{
    width:100%;
    height:300px;
    object-fit:cover;
    border-radius:15px;
}

.rating{
    color:gold;
    font-size:25px;
    margin:15px 0;
}

.buy-btn{
    display:inline-block;
    margin-top:20px;
    background:green;
    color:white;
    text-decoration:none;
    padding:12px 25px;
    border-radius:30px;
    font-weight:bold;
}

.buy-btn:hover{
    background:darkgreen;
}

.footer{
    text-align:center;
    margin-top:50px;
    padding:20px;
    color:gray;
}

@media(max-width:768px){

.product{
    width:90%;
}

.popup-content{
    width:95%;
}

}

</style>

</head>

<body>

<nav>
    <a href="index.html">Trang Chủ</a>
    <a href="sanpham.html">Sản Phẩm</a>

</nav>

<div class="rating">
⭐⭐⭐⭐⭐
</div>

<p id="popupThanhPhan"></p>

<br>

<p id="popupCongDung"></p>

<br>

<p id="popupCachDung"></p>

<br>

<h3 id="popupGia" style="color:red;"></h3>

<a href="dathang.html" class="buy-btn">
🛒 Mua Ngay
</a>

</div>

</div>

<div class="footer">
© 2026 Nước Sâm Huy Nguyễn
</div>

<script>

function xemChiTiet(maSP){

let ten="";
let img="";
let thanhPhan="";
let congDung="";
let cachDung="";
let gia="";

if(maSP==="NS01"){

    ten="NƯỚC SÂM 500ML";

    img="https://th.bing.com/th/id/R.2b3eccbc261e36c01a0ce06ade22d51a?rik=%2fqQAps9QESEGQQ&pid=ImgRaw&r=0";

    cachDung="🥤 Cách dùng: Uống ngon hơn khi để lạnh.";

    gia="Giá bán: 10.000đ";
}

if(maSP==="NS02"){

    ten="NƯỚC SÂM 1 LÍT";

    img="https://file.hstatic.net/200000029694/file/ong-sam-co-cu-wonkisam-korean-ginseng-drink-han-quoc-10-chai-x-120ml-4_1024x1024.jpg";

    thanhPhan="🌿 Thành phần: Mía lau, la hán quả, lá dứa, rễ tranh.";

    congDung="💚 Công dụng: Thích hợp dùng cho gia đình và nhóm nhiều người.";

    cachDung="🥤 Cách dùng: Bảo quản lạnh sau khi mở nắp.";

    gia="Giá bán: 18.000đ";
}

if(maSP==="NS03"){

    ten="NƯỚC SÂM KHÔNG ĐƯỜNG";

    img="https://tse2.mm.bing.net/th/id/OIP.hG7L_4FyEtXXxidDzGPkAwHaHL?r=0&o=7&pid=ImgDetMain";

    thanhPhan="🌿 Thành phần: Thảo mộc tự nhiên, không bổ sung đường.";

    congDung="💚 Công dụng: Phù hợp người ăn kiêng và hạn chế đường.";

    cachDung="🥤 Cách dùng: Dùng lạnh hoặc thêm đá.";

    gia="Giá bán: 12.000đ";
}

document.getElementById("popupImg").src = img;
document.getElementById("popupName").innerHTML = ten;
document.getElementById("popupThanhPhan").innerHTML = thanhPhan;
document.getElementById("popupCongDung").innerHTML = congDung;
document.getElementById("popupCachDung").innerHTML = cachDung;
document.getElementById("popupGia").innerHTML = gia;

document.getElementById("popup").style.display = "block";

}

function dongPopup(){

document.getElementById("popup").style.display = "none";

}

window.onclick = function(event){

let popup = document.getElementById("popup");

if(event.target == popup){

popup.style.display = "none";

}

}

</script>
