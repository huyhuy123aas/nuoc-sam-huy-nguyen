<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đặt Hàng - Nước Sâm Huy Nguyễn</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5fff5;
}

nav{
    background:green;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

nav a:hover{
    color:gold;
}

.container{
    max-width:700px;
    margin:40px auto;
    padding:20px;
}

h1{
    text-align:center;
    color:darkgreen;
    margin-bottom:30px;
}

form{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

textarea{
    resize:none;
}

.tong-tien{
    font-size:24px;
    font-weight:bold;
    color:red;
    margin-top:20px;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:green;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:darkgreen;
}

.success{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    border:1px solid green;
    background:#eaffea;
    color:darkgreen;
    text-align:center;
}

.footer{
    text-align:center;
    color:gray;
    margin-top:40px;
    padding:20px;
}

</style>

</head>

<body>

<nav>
    <a href="index.html">Trang Chủ</a>
    <a href="sanpham.html">Sản Phẩm</a>
    <a href="dathang.html">Đặt Hàng</a>
</nav>

<div class="container">

    <h1>🛒 ĐẶT HÀNG</h1>

    <form id="orderForm">

        <label>Họ và Tên</label>
        <input id="ten" type="text" required>

        <label>Số Điện Thoại</label>
        <input id="sdt" type="tel" required>

        <label>Sản Phẩm</label>

        <select
        id="productSelect"
        onchange="tinhTien()"
        required>

            <option value="">
            -- Chọn sản phẩm --
            </option>

            <option value="NS01">
            NS01 - Nước Sâm 500ml
            </option>

            <option value="NS02">
            NS02 - Nước Sâm 1L
            </option>

            <option value="NS03">
            NS03 - Nước Sâm Không Đường
            </option>

        </select>

        <label>Số Lượng</label>

        <input
        id="quantity"
        type="number"
        min="1"
        value="1"
        oninput="tinhTien()"
        required>

        <div class="tong-tien">
            Tổng tiền:
            <span id="tongTien">0đ</span>
        </div>

        <label>Ghi Chú</label>

        <textarea
        id="ghiChu"
        rows="4"
        placeholder="Ví dụ: giao sau 18h..."></textarea>

        <button type="submit">
            ✅ XÁC NHẬN ĐẶT HÀNG
        </button>

    </form>

    <div
    id="successMessage"
    class="success">

        ✅ Đặt hàng thành công!

        <br><br>

        Chúng tôi sẽ liên hệ với bạn sớm nhất.

    </div>

</div>

<div class="footer">
    © 2026 Nước Sâm Huy Nguyễn
</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyNADXSFiFeI3I3zwEzLKM4CMpAR2Fe-Vvup8iSolmVHdDtPyXJEMeB1AKPbYW26NFTWA/exec";

function tinhTien(){

    const sp =
    document.getElementById("productSelect").value;

    const sl =
    Number(document.getElementById("quantity").value);

    let gia = 0;

    if(sp === "NS01") gia = 10000;
    if(sp === "NS02") gia = 18000;
    if(sp === "NS03") gia = 12000;

    const tong = gia * sl;

    document.getElementById("tongTien").innerHTML =
    tong.toLocaleString("vi-VN") + "đ";
}

document
.getElementById("orderForm")
.addEventListener("submit",

async function(e){

    e.preventDefault();

    const ten =
    document.getElementById("ten").value;

    const sdt =
    document.getElementById("sdt").value;

    const sanPham =
    document.getElementById("productSelect").value;

    const soLuong =
    document.getElementById("quantity").value;

    const ghiChu =
    document.getElementById("ghiChu").value;

    const tongTien =
    document.getElementById("tongTien").innerText;

    try{

        await fetch(
            SCRIPT_URL,
            {
                method:"POST",
                mode:"no-cors",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    ten,
                    sdt,
                    sanPham,
                    soLuong,
                    tongTien,
                    ghiChu
                })
            }
        );

        document
        .getElementById("successMessage")
        .style.display = "block";

        document
        .getElementById("orderForm")
        .reset();

        document
        .getElementById("tongTien")
        .innerHTML = "0đ";

        tinhTien();

    }
    catch(error){

        console.error(error);

        alert(
            "❌ Không gửi được đơn hàng."
        );
    }

});

tinhTien();

</script>

</body>
</html>
